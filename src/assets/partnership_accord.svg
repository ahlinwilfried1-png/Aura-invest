<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="headerGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Clip Paths for Corner Images -->
    <clipPath id="leftCut">
      <polygon points="0,0 230,0 160,300 0,220" />
    </clipPath>
    <clipPath id="rightCut">
      <polygon points="970,0 1200,0 1200,220 1040,300" />
    </clipPath>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="pillShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Document Card Container -->
  <rect width="1200" height="820" rx="20" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />

  <!-- Diagonal Green Frame Accents in Corners -->
  <polygon points="0,0 240,0 0,320" fill="#059669" opacity="0.15"/>
  <polygon points="0,0 220,0 170,280 0,210" fill="#047857"/>
  <line x1="220" y1="0" x2="170" y2="280" stroke="#84cc16" stroke-width="6"/>

  <polygon points="1200,0 960,0 1200,320" fill="#059669" opacity="0.15"/>
  <polygon points="1200,0 980,0 1030,280 1200,210" fill="#047857"/>
  <line x1="980" y1="0" x2="1030" y2="280" stroke="#84cc16" stroke-width="6"/>

  <!-- World Map Overlay Background Pattern -->
  <g opacity="0.04" fill="#0f172a">
    <circle cx="600" cy="400" r="300" stroke="#000" stroke-width="2" fill="none"/>
    <ellipse cx="600" cy="400" rx="300" ry="120" stroke="#000" stroke-width="1.5" fill="none"/>
    <ellipse cx="600" cy="400" rx="150" ry="300" stroke="#000" stroke-width="1.5" fill="none"/>
    <line x1="300" y1="400" x2="900" y2="400" stroke="#000" stroke-width="2"/>
  </g>

  <!-- TOP BRANDING & HEADER -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Nutrien Logo Leaves -->
    <path d="M-18,-5 C-35,-25 -10,-45 0,-45 C0,-45 5,-25 -18,-5 Z" fill="#84cc16"/>
    <path d="M0,-45 C10,-45 35,-25 18,-5 C-5,-25 0,-45 0,-45 Z" fill="#16a34a"/>
    <path d="M-8,-10 C-25,-5 -30,15 -10,20 C5,10 -8,-10 -8,-10 Z" fill="#65a30d"/>
    
    <!-- Nutrien Header Title -->
    <text y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="2">NUTRIEN</text>
    <text y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#047857" letter-spacing="6">AGRICULTURE</text>
  </g>

  <!-- MAIN DOCUMENT TITLES -->
  <text x="600" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="31" fill="#064e3b" letter-spacing="1">ACCORD DE PARTENARIAT INTERNATIONAL</text>
  <text x="600" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17" fill="#1e293b" letter-spacing="2">SIGNATURE DE CONTRAT DE COLLABORATION</text>

  <!-- Leaf Separator Icon -->
  <path d="M600,184 C592,192 590,202 600,206 C610,202 608,192 600,184 Z" fill="#16a34a"/>

  <!-- PREAMBLE TEXT -->
  <text x="600" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="15" fill="#334155">
    Nous, soussignés, confirmons par la présente la signature d'un accord de partenariat stratégique
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="15" fill="#334155">
    en vue de promouvoir le <tspan font-weight="800" fill="#0f172a">développement durable de l'agriculture</tspan> à l'échelle mondiale.
  </text>

  <!-- BANNER 1: PARTENAIRES ENGAGÉS -->
  <g transform="translate(600, 290)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text text-anchor="middle" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="1.5">PARTENAIRES ENGAGÉS POUR UNE AGRICULTURE DURABLE</text>
  </g>

  <!-- PARTNERS CONTAINER BOX -->
  <rect x="35" y="322" width="1130" height="150" rx="16" fill="#ffffff" fill-opacity="0.8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 6 PARTNERS COLUMNS -->
  <!-- Partner 1: Nutrien Togo -->
  <g transform="translate(130, 395)" text-anchor="middle">
    <!-- Nutrien Mini Logo -->
    <path d="M-10,-28 C-20,-40 -5,-50 0,-50 C0,-50 3,-38 -10,-28 Z" fill="#84cc16"/>
    <path d="M0,-50 C6,-50 20,-38 10,-28 C-3,-38 0,-50 0,-50 Z" fill="#16a34a"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="15" fill="#0f172a">NUTRIEN</text>
    <text y="4" font-family="sans-serif" font-weight="800" font-size="8" fill="#047857" letter-spacing="2">AGRICULTURE</text>
    <!-- Flag Togo -->
    <g transform="translate(-32, 22)">
      <rect width="20" height="12" rx="2" fill="#22c55e"/>
      <rect y="2.4" width="20" height="2.4" fill="#eab308"/>
      <rect y="7.2" width="20" height="2.4" fill="#eab308"/>
      <rect width="8" height="7.2" rx="1" fill="#ef4444"/>
      <polygon points="4,1.5 4.8,3.5 3,2.2 5,2.2 3.2,3.5" fill="#ffffff"/>
    </g>
    <text x="-4" y="32" font-family="sans-serif" font-weight="800" font-size="11" fill="#334155">TOGO</text>
    <text y="45" font-family="sans-serif" font-weight="600" font-size="10" fill="#64748b">Siège Social</text>
  </g>
  <line x1="223" y1="337" x2="223" y2="457" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Partner 2: Corteva USA -->
  <g transform="translate(318, 395)" text-anchor="middle">
    <!-- Corteva Logo Icon -->
    <path d="M-22,-42 C-5,-50 15,-50 22,-35 C10,-25 -10,-25 -22,-42 Z" fill="#0284c7"/>
    <path d="M-22,-32 C-5,-40 15,-40 22,-25 C10,-15 -10,-15 -22,-32 Z" fill="#0369a1"/>
    <text y="-2" font-family="sans-serif" font-weight="900" font-size="14" fill="#0f172a" letter-spacing="1">CORTEVA</text>
    <text y="9" font-family="sans-serif" font-weight="700" font-size="8" fill="#0284c7">agriscience</text>
    <!-- Flag USA -->
    <g transform="translate(-52, 22)">
      <rect width="20" height="12" rx="2" fill="#ef4444"/>
      <rect y="2" width="20" height="2" fill="#ffffff"/>
      <rect y="6" width="20" height="2" fill="#ffffff"/>
      <rect y="10" width="20" height="2" fill="#ffffff"/>
      <rect width="9" height="6.5" fill="#1e3a8a"/>
    </g>
    <text x="8" y="32" font-family="sans-serif" font-weight="800" font-size="10" fill="#334155">CORTEVA AGRISCIENCE</text>
    <text y="45" font-family="sans-serif" font-weight="800" font-size="11" fill="#1e293b">ÉTATS-UNIS</text>
  </g>
  <line x1="411" y1="337" x2="411" y2="457" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Partner 3: Bayer Germany -->
  <g transform="translate(506, 395)" text-anchor="middle">
    <!-- Bayer Logo Circle -->
    <circle cx="0" cy="-28" r="20" fill="none" stroke="#0284c7" stroke-width="3"/>
    <text y="-32" font-family="sans-serif" font-weight="900" font-size="9" fill="#0284c7">BAYER</text>
    <text y="-20" font-family="sans-serif" font-weight="900" font-size="9" fill="#0284c7">BAYER</text>
    <!-- Flag Germany -->
    <g transform="translate(-40, 22)">
      <rect width="20" height="4" fill="#000000"/>
      <rect y="4" width="20" height="4" fill="#ef4444"/>
      <rect y="8" width="20" height="4" fill="#eab308"/>
    </g>
    <text x="12" y="32" font-family="sans-serif" font-weight="800" font-size="11" fill="#334155">BAYER AG</text>
    <text y="45" font-family="sans-serif" font-weight="800" font-size="11" fill="#1e293b">ALLEMAGNE</text>
  </g>
  <line x1="600" y1="337" x2="600" y2="457" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Partner 4: Syngenta Switzerland -->
  <g transform="translate(694, 395)" text-anchor="middle">
    <text y="-24" font-family="sans-serif" font-weight="900" font-size="18" fill="#7c3aed" letter-spacing="-0.5">syngenta</text>
    <!-- Flag Switzerland -->
    <g transform="translate(-36, 22)">
      <rect width="16" height="12" rx="2" fill="#ef4444"/>
      <rect x="6.5" y="2" width="3" height="8" fill="#ffffff"/>
      <rect x="4" y="4.5" width="8" height="3" fill="#ffffff"/>
    </g>
    <text x="10" y="32" font-family="sans-serif" font-weight="800" font-size="11" fill="#334155">SYNGENTA</text>
    <text y="45" font-family="sans-serif" font-weight="800" font-size="11" fill="#1e293b">SUISSE</text>
  </g>
  <line x1="788" y1="337" x2="788" y2="457" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Partner 5: Yara Norway -->
  <g transform="translate(882, 395)" text-anchor="middle">
    <!-- Yara Viking Ship Icon Box -->
    <rect x="-18" y="-46" width="36" height="26" rx="4" fill="#1e3a8a"/>
    <path d="M-10,-26 C-5,-38 5,-38 10,-26 Z" fill="#ffffff"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="10" fill="#1e3a8a" letter-spacing="1">YARA</text>
    <!-- Flag Norway -->
    <g transform="translate(-56, 22)">
      <rect width="20" height="12" rx="2" fill="#ef4444"/>
      <rect x="6" width="4" height="12" fill="#ffffff"/>
      <rect y="4" width="20" height="4" fill="#ffffff"/>
      <rect x="7" width="2" height="12" fill="#1e3a8a"/>
      <rect y="5" width="20" height="2" fill="#1e3a8a"/>
    </g>
    <text x="14" y="32" font-family="sans-serif" font-weight="800" font-size="10" fill="#334155">YARA INTERNATIONAL</text>
    <text y="45" font-family="sans-serif" font-weight="800" font-size="11" fill="#1e293b">NORVÈGE</text>
  </g>
  <line x1="976" y1="337" x2="976" y2="457" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Partner 6: FMC USA -->
  <g transform="translate(1070, 395)" text-anchor="middle">
    <text y="-20" font-family="sans-serif" font-weight="900" font-size="24" fill="#dc2626" letter-spacing="-1">FMC</text>
    <!-- Flag USA -->
    <g transform="translate(-52, 22)">
      <rect width="20" height="12" rx="2" fill="#ef4444"/>
      <rect y="2" width="20" height="2" fill="#ffffff"/>
      <rect y="6" width="20" height="2" fill="#ffffff"/>
      <rect y="10" width="20" height="2" fill="#ffffff"/>
      <rect width="9" height="6.5" fill="#1e3a8a"/>
    </g>
    <text x="8" y="32" font-family="sans-serif" font-weight="800" font-size="10" fill="#334155">FMC CORPORATION</text>
    <text y="45" font-family="sans-serif" font-weight="800" font-size="11" fill="#1e293b">ÉTATS-UNIS</text>
  </g>

  <!-- TRANSITION TEXT -->
  <text x="600" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#475569">
    Ce partenariat vise à combiner nos expertises et nos ressources pour relever ensemble
  </text>
  <text x="600" y="513" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#475569">
    les défis mondiaux de la sécurité alimentaire et de l'innovation agricole.
  </text>

  <!-- BANNER 2: SIGNATURES DES DIRECTEURS GÉNÉRAUX -->
  <g transform="translate(600, 548)">
    <rect x="-220" y="-18" width="440" height="36" rx="18" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text text-anchor="middle" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="1.5">SIGNATURES DES DIRECTEURS GÉNÉRAUX</text>
  </g>

  <!-- SIGNATURES CONTAINER BOX -->
  <rect x="35" y="580" width="1130" height="185" rx="16" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 6 DIRECTORS SIGNATURES & SEALS -->

  <!-- Director 1: Koffi A. ESSOWE (Nutrien) -->
  <g transform="translate(130, 670)" text-anchor="middle">
    <!-- Signature Cursive -->
    <path d="M-30,-42 C-15,-65 0,-30 15,-50 C25,-60 -5,-25 30,-35" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="12" fill="#0f172a">M. Koffi A. ESSOWE</text>
    <text y="6" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Directeur Général</text>
    <text y="19" font-family="sans-serif" font-weight="900" font-size="10" fill="#047857">NUTRIEN AGRICULTURE</text>
    <!-- Official Circular Stamp -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="3,1"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#047857" stroke-width="1"/>
      <!-- Stamp Leaves Icon -->
      <path d="M-6,-6 C-12,-15 0,-18 0,-18 C0,-18 2,-10 -6,-6 Z" fill="#047857"/>
      <path d="M0,-18 C4,-18 12,-10 6,-6 C-2,-10 0,-18 0,-18 Z" fill="#16a34a"/>
      <text y="10" font-family="sans-serif" font-weight="900" font-size="6" fill="#047857" letter-spacing="0.5">AGRICULTURE</text>
    </g>
  </g>
  <line x1="223" y1="595" x2="223" y2="755" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Director 2: Chuck MAGRO (Corteva) -->
  <g transform="translate(318, 670)" text-anchor="middle">
    <!-- Signature Cursive -->
    <path d="M-35,-35 C-20,-60 -10,-20 10,-55 C20,-30 0,-15 35,-40" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="12" fill="#0f172a">M. Chuck MAGRO</text>
    <text y="6" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Directeur Général</text>
    <text y="19" font-family="sans-serif" font-weight="900" font-size="10" fill="#0284c7">CORTEVA AGRISCIENCE</text>
    <!-- Official Circular Stamp -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="3,1"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#0284c7" stroke-width="1"/>
      <path d="M-10,-5 C0,-12 10,-5 0,-2 Z" fill="#0284c7"/>
      <text y="10" font-family="sans-serif" font-weight="900" font-size="6" fill="#0284c7" letter-spacing="0.5">AGRISCIENCE</text>
    </g>
  </g>
  <line x1="411" y1="595" x2="411" y2="755" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Director 3: Werner BAUMANN (Bayer) -->
  <g transform="translate(506, 670)" text-anchor="middle">
    <!-- Signature Cursive -->
    <path d="M-30,-50 C-10,-20 0,-60 15,-30 C25,-45 10,-10 30,-30" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="12" fill="#0f172a">M. Werner BAUMANN</text>
    <text y="6" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Directeur Général</text>
    <text y="19" font-family="sans-serif" font-weight="900" font-size="10" fill="#0369a1">BAYER AG</text>
    <!-- Official Circular Stamp -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#0369a1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#0369a1" stroke-width="1"/>
      <text y="-2" font-family="sans-serif" font-weight="900" font-size="6" fill="#0369a1">BAYER</text>
      <text y="8" font-family="sans-serif" font-weight="900" font-size="6" fill="#0369a1">CROP</text>
    </g>
  </g>
  <line x1="600" y1="595" x2="600" y2="755" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Director 4: Erik FJÄLLSTRÖM (Syngenta) -->
  <g transform="translate(694, 670)" text-anchor="middle">
    <!-- Signature Cursive -->
    <path d="M-35,-40 C-15,-60 5,-20 15,-50 C30,-30 10,-15 35,-45" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="12" fill="#0f172a">M. Erik FJÄLLSTRÖM</text>
    <text y="6" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Directeur Général</text>
    <text y="19" font-family="sans-serif" font-weight="900" font-size="10" fill="#7c3aed">SYNGENTA</text>
    <!-- Official Circular Stamp -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4,1"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#7c3aed" stroke-width="1"/>
      <path d="M-6,-8 C-10,-16 0,-18 0,-18 C0,-18 2,-10 -6,-8 Z" fill="#7c3aed"/>
      <text y="10" font-family="sans-serif" font-weight="900" font-size="6" fill="#7c3aed" letter-spacing="0.5">SYNGENTA</text>
    </g>
  </g>
  <line x1="788" y1="595" x2="788" y2="755" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Director 5: Svein TORE HOLSETHER (Yara) -->
  <g transform="translate(882, 670)" text-anchor="middle">
    <!-- Signature Cursive -->
    <path d="M-30,-45 C-15,-20 -5,-65 10,-35 C20,-50 15,-15 30,-35" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="11" fill="#0f172a">M. Svein TORE HOLSETHER</text>
    <text y="6" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Directeur Général</text>
    <text y="19" font-family="sans-serif" font-weight="900" font-size="10" fill="#1e3a8a">YARA INTERNATIONAL</text>
    <!-- Official Circular Stamp -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#1e3a8a" stroke-width="1"/>
      <text y="-2" font-family="sans-serif" font-weight="900" font-size="6" fill="#1e3a8a">YARA</text>
      <text y="8" font-family="sans-serif" font-weight="900" font-size="5" fill="#1e3a8a">NORWAY</text>
    </g>
  </g>
  <line x1="976" y1="595" x2="976" y2="755" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Director 6: Pierre BRONDY (FMC) -->
  <g transform="translate(1070, 670)" text-anchor="middle">
    <!-- Signature Cursive -->
    <path d="M-35,-35 C-20,-55 -5,-25 15,-45 C25,-25 5,-10 35,-30" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text y="-8" font-family="sans-serif" font-weight="900" font-size="12" fill="#0f172a">M. Pierre BRONDY</text>
    <text y="6" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Directeur Général</text>
    <text y="19" font-family="sans-serif" font-weight="900" font-size="10" fill="#dc2626">FMC CORPORATION</text>
    <!-- Official Circular Stamp -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3,1"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#dc2626" stroke-width="1"/>
      <text y="2" font-family="sans-serif" font-weight="900" font-size="7" fill="#dc2626">FMC</text>
      <text y="10" font-family="sans-serif" font-weight="900" font-size="5" fill="#dc2626">USA</text>
    </g>
  </g>

  <!-- FOOTER DATE -->
  <g transform="translate(600, 792)" text-anchor="middle">
    <rect x="-130" y="-14" width="260" height="24" rx="12" fill="#0f172a"/>
    <text y="2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#f8fafc" letter-spacing="1">Fait à Lomé, le 05 Mai 2024</text>
  </g>
</svg>
